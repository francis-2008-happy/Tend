<div
  style="
    font-family: Georgia, serif;
    color: #2c302e;
    background: #f8f5ef;
    padding: 32px;
  "
>
  <h2 style="color: #3d5a4c; font-weight: normal">Choose a new password</h2>
  <p style="font-family: Arial, sans-serif; font-size: 16px; line-height: 1.6">
    Someone (hopefully you) asked to reset your Tend password. Tap below to
    choose a new one.
  </p>
  <p>
    <a
      href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=recovery"
      style="
        display: inline-block;
        background: #3d5a4c;
        color: #ffffff;
        padding: 14px 24px;
        border-radius: 12px;
        font-family: Arial, sans-serif;
        text-decoration: none;
      "
      >Choose a new password</a
    >
  </p>
  <p style="font-family: Arial, sans-serif; font-size: 14px; color: #5e6f58">
    Didn't ask for this? Your password hasn't changed, and you can ignore this
    email.
  </p>
</div>
