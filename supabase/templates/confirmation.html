<div
  style="
    font-family: Georgia, serif;
    color: #2c302e;
    background: #f8f5ef;
    padding: 32px;
  "
>
  <h2 style="color: #3d5a4c; font-weight: normal">Welcome to Tend</h2>
  <p style="font-family: Arial, sans-serif; font-size: 16px; line-height: 1.6">
    We're so glad you're here. Tap the button below to confirm your email and
    step inside.
  </p>
  <p>
    <a
      href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=signup"
      style="
        display: inline-block;
        background: #3d5a4c;
        color: #ffffff;
        padding: 14px 24px;
        border-radius: 12px;
        font-family: Arial, sans-serif;
        text-decoration: none;
      "
      >Confirm my email</a
    >
  </p>
  <p style="font-family: Arial, sans-serif; font-size: 14px; color: #5e6f58">
    Didn't sign up for Tend? You can safely ignore this email.
  </p>
</div>
