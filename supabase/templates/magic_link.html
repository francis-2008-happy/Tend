<div
  style="
    font-family: Georgia, serif;
    color: #2c302e;
    background: #f8f5ef;
    padding: 32px;
  "
>
  <h2 style="color: #3d5a4c; font-weight: normal">Your Tend sign-in code</h2>
  <p style="font-family: Arial, sans-serif; font-size: 16px; line-height: 1.6">
    Type this code into Tend:
  </p>
  <p
    style="
      font-family: Arial, sans-serif;
      font-size: 32px;
      letter-spacing: 8px;
      font-weight: bold;
      color: #3d5a4c;
    "
  >
    {{ .Token }}
  </p>
  <p style="font-family: Arial, sans-serif; font-size: 16px; line-height: 1.6">
    Or, if you're on the same phone or computer, just tap here:
  </p>
  <p>
    <a
      href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=email"
      style="
        display: inline-block;
        background: #3d5a4c;
        color: #ffffff;
        padding: 14px 24px;
        border-radius: 12px;
        font-family: Arial, sans-serif;
        text-decoration: none;
      "
      >Log in to Tend</a
    >
  </p>
  <p style="font-family: Arial, sans-serif; font-size: 14px; color: #5e6f58">
    The code works for one hour. Didn't ask for it? You can safely ignore this
    email.
  </p>
</div>
